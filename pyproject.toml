[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ci-gates"
version = "0.1.0"
description = "Quality gates locales para no mergear regresiones de IA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Angel Salazar" }]
dependencies = ["pytest>=8.0.0", "rich>=13.7.0", "pyyaml>=6.0"]

[project.scripts]
llm-ci = "llm_ci_gates.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
